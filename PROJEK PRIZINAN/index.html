<!doctype html>
<html lang="id">
  <head>
    <!-- Karakter -->
    <meta charset="UTF-8" />

    <!-- Tampilan responsif di HP -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Deskripsi aplikasi -->
    <meta
      name="description"
      content="Aplikasi Perizinan Santri untuk sistem pendataan dan pengajuan perizinan pesantren"
    />

    <!-- Progressive Web App -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <!-- Warna tema aplikasi -->
    <meta
      name="theme-color"
      content="#2563eb"
    />

    <!-- Logo/Favicon aplikasi -->
    <link
      rel="icon"
      type="image/png"
      href="/icon-192.png"
    />

    <!-- Logo ketika aplikasi diinstal di perangkat Apple -->
    <link
      rel="apple-touch-icon"
      href="/icon-192.png"
    />

    <!-- Judul aplikasi -->
    <title>Perizinan Santri</title>
  </head>

  <body>
    <!-- Root aplikasi React -->
    <div id="root"></div>

    <!-- Menjalankan aplikasi -->
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
